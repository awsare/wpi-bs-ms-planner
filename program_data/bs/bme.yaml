id: bme
name: B.S. in Biomedical Engineering
catalog_url: https://wpi.cleancatalog.net/biomedical-engineering/biomedical-engineering-major
# undergrad credits: 1/3 unit = 3 credits, 15 units = 135; the rest is free electives
total_credits: 135
requirements:
  # must include calculus; advanced substitutes need department approval
  - name: Mathematics
    min_credits: 18
    courses: [MA 1021, MA 1022, MA 1023, MA 1024, MA 1033, MA 1034, MA 1120]
    children:
      - name: Differential Equations
        min_credits: 3
        courses: [MA 2051]
      - name: Statistics
        min_credits: 3
        courses: [MA 2610, MA 2611]

  - name: Basic Science
    min_credits: 18
    children:
      - name: Biology
        min_credits: 6
        match:
          code_prefix: BB
          academic_level: Undergraduate
        children:
          - name: 2000-Level Biology
            min_credits: 3
            match:
              code_prefix: BB
              academic_level: Undergraduate
              code_min: 2000
      - name: Chemistry
        min_credits: 6
        match:
          code_prefix: CH
          academic_level: Undergraduate
      - name: Physics
        min_credits: 6
        match:
          code_prefix: PH
          academic_level: Undergraduate

  - name: Supplemental Science
    min_credits: 3
    courses: [FY 1100, FY 1101, FY 1800]
    match:
      code_prefix: [BB, CH, CS, MA, PH]
      academic_level: Undergraduate

  - name: Computer Science
    min_credits: 3
    courses: [BME 1004, CS 1004, CS 1101, CS 1102, CS 2301, CS 2303]

  - name: Physiology
    min_credits: 3
    courses: [BME 3112, BB 3101, BB 3102, BB 3815]

  # not modeled: at most 1/3 unit at the 500/5000 level; at most 1/3 unit of independent study
  # the BME coursework and lab rules were read from a summary of the catalog page, not verbatim
  - name: Biomedical Engineering and Engineering
    min_credits: 42
    children:
      - name: 2000-Level Engineering
        min_credits: 9
        match:
          code_prefix: [AE, AREN, BME, CHE, CE, ECE, ES, FP, ME, RBE]
          academic_level: Undergraduate
          code_min: 2000
      - name: 3000-Level Engineering
        min_credits: 6
        match:
          code_prefix: [AE, AREN, BME, CHE, CE, ECE, ES, FP, ME, RBE]
          academic_level: Undergraduate
          code_min: 3000
      - name: BME Coursework
        min_credits: 27
        children:
          - name: 2000-Level BME
            min_credits: 12
            match:
              code_prefix: BME
              academic_level: Undergraduate
              code_min: 2000
          # not modeled: three 3000-level and one 4000-level lab in one focus area
          - name: BME Labs
            min_credits: 6
            courses: [BME 3012, BME 3013, BME 3505, BME 3507, BME 3811, BME 3813, BME 4012, BME 4505,
                      BME 4507, BME 4607, BME 4811, BME 4813]
          - name: BME Design
            min_credits: 3
            courses: [BME 3300]
          - name: 4000-Level BME
            min_credits: 6
            match:
              code_prefix: BME
              academic_level: Undergraduate
              code_min: 4000

  # at least one course in each
  - name: Core Competencies
    children:
      - name: Biomechanics or Biofluids
        min_credits: 3
        courses: [BME 2502, BME 3610, ES 2501, ES 2502, ES 2503, ES 3004]
      - name: Biomaterials or Tissue Engineering
        min_credits: 3
        courses: [BME 2001, ES 2001]
      - name: Biosensors or Bioinstrumentation
        min_credits: 3
        courses: [BME 2210, ECE 2010]
      - name: Experimental Measurement and Data Analysis
        min_credits: 3
        courses: [BME 2211, ME 3901]

  # 1/6 unit
  - name: Living Systems Lab
    min_courses: 1
    courses: [BME 3012, BME 3507, BME 3813]

  # includes 1/3 unit capstone design; a research MQP needs BME 4301 or equivalent
  # not in the course listings
  - name: Major Qualifying Project
    min_credits: 9
