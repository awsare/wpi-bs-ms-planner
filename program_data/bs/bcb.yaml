id: bcb
name: B.S. in Bioinformatics and Computational Biology
catalog_url: https://wpi.cleancatalog.net/bioinformatics-and-computational-biology/bioinformatics-and-computational-biology-major
# undergrad credits: 1/3 unit = 3 credits, 15 units = 135; the rest is free electives
total_credits: 135
requirements:
  # not modeled: at least 4/3 units at the 4000 level; no course fills two requirements
  # not modeled: not both BCB 4001 and BCB 501, not both BCB 4004 and BCB 504
  - name: Bioinformatics and Computational Biology
    min_credits: 6
    courses: [BB 1003, BCB 1003, BB 3010, BCB 3010, BB 4001, BCB 4001, BCB 4004, MA 4603]
    match:
      code_prefix: BCB
      academic_level: Graduate

  # remaining 1/3 unit: statistics, probability, calculus or differential equations
  - name: Mathematics Foundation
    min_credits: 15
    courses: [MA 2051, MA 2621]
    children:
      - name: Calculus
        min_credits: 6
        courses: [MA 1020, MA 1021, MA 1022, MA 1120, MA 1023, MA 1024]
      - name: Linear Algebra
        min_credits: 3
        courses: [MA 2071]
      - name: Statistics
        min_credits: 3
        courses: [MA 2610, MA 2611, MA 2612]

  - name: Computer Science Foundation
    min_credits: 12
    children:
      - name: 1000-Level Programming
        min_credits: 3
        courses: [CS 1004, CS 1101, CS 1102]
      - name: 2000-Level Programming
        min_credits: 3
        courses: [CS 2102, CS 2103, CS 2119, CS 2301]
      - name: Discrete Mathematics and Algorithms
        min_credits: 6
        courses: [CS 2022, MA 2201, CS 2223]

  # remaining 2/3 unit: lecture list or any 3000-level or higher BB lecture
  - name: Biology Foundation
    min_credits: 15
    courses: [BB 2003, BB 2030, BB 2040, BB 2101, BB 3950, CH 4170]
    match:
      code_prefix: BB
      academic_level: Undergraduate
      code_min: 3000
    children:
      - name: Foundational Biology
        min_credits: 3
        courses: [BB 1101, BB 1102]
      # cell biology (BB 2550) or genetics (BB 2920), by title
      - name: Cell Biology or Genetics
        min_credits: 3
        courses: [BB 2550, BB 2920]
      - name: Biology Laboratory
        min_credits: 3
        courses: [BB 2802, BB 2803, BB 2804, BB 2815]

  - name: Chemistry Foundation
    min_credits: 12
    courses: [CH 4110]
    children:
      - name: General Chemistry
        min_credits: 6
        courses: [CH 1010, CH 1020, CH 1030]
      - name: Organic Chemistry
        min_credits: 3
        courses: [CH 2310, CH 2320, CH 2360]

  - name: Ethics, Social Implications and Policy
    min_credits: 3
    courses: [CS 3043, SS 3043, GOV 2302, GOV 2311, GOV 2314, ID 2314, GOV 2315, PY 2713, PY 2731,
              RE 2731]

  - name: Advanced Electives
    min_credits: 18
    children:
      - name: Most Related to BCB
        min_credits: 9
        courses: [BB 3010, BCB 3010, BB 3140, BB 3950, BB 4001, BCB 4001, BB 4190, CH 4190,
                  BCB 4004, MA 4603, CH 4110, CH 4120, CS 3431, CS 4341, CS 4342, CS 4445,
                  CS 4804, MA 2621, MA 3627]
        match:
          code_prefix: BCB
          academic_level: Graduate
      - name: Additional Advanced Electives
        min_credits: 3
        courses: [BB 3813, BB 3815, BB 3821, BB 3825, BB 3827, BB 3830, BB 3840, BB 3870, BB 3003,
                  BB 3060, BB 3080, BB 3101, BB 3102, BB 3120, BB 3620, BB 3920, BB 4050, BB 4260,
                  BB 4900, BME 3813, BME 4201, BME 4701, CH 4130, CS 3733, CS 4032, MA 3257,
                  CS 4033, MA 3457, CS 4120, CS 4241, CS 4432, CS 4433, DS 4433, CS 4731, DS 3010,
                  DS 4635, MA 4635, MA 2271, MA 2273, MA 2431, MA 2631, MA 3631, MA 4214, MA 4473,
                  MA 4631, MA 4632]

  # not in the course listings
  - name: Major Qualifying Project
    min_credits: 9
