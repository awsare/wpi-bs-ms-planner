id: ae
name: B.S. in Aerospace Engineering
catalog_url: https://wpi.cleancatalog.net/aerospace-engineering/aerospace-engineering-major
# undergrad credits: 1/3 unit = 3 credits, 15 units = 135; the rest is free electives
total_credits: 135
requirements:
  # course lists are the catalog's recommended courses
  - name: Mathematics and Basic Sciences
    min_credits: 30
    children:
      - name: Mathematics
        min_credits: 21
        courses: [MA 1021, MA 1022, MA 1023, MA 1024, MA 2051, MA 2071, MA 2611]
      - name: Physics
        min_credits: 6
        courses: [PH 1110, PH 1111, PH 1120, PH 1121]
      - name: Chemistry
        min_credits: 3
        courses: [CH 1010, CH 1020]

  - name: Core Aerospace Engineering
    min_credits: 33
    children:
      - name: Fluid Dynamics
        min_credits: 6
        courses: [AE 2110, AE 3110]
      - name: Propulsion and Energy
        min_credits: 3
        courses: [AE 2210]
      - name: Materials and Structures
        min_credits: 12
        courses: [AE 2410, AE 3420, AE 4410, ES 2001]
      - name: Flight Dynamics and Controls
        min_credits: 6
        courses: [AE 2310, ES 2503]
      - name: Experimentation
        min_credits: 3
        courses: [AE 3010, ME 3901, ME 3902]
      - name: Space Environments
        min_credits: 3
        courses: [PH 2550, AE 2550]

  # 9/3 units per track including the 3/3 unit MQP, which is listed separately
  - name: Track
    min_children: 1
    children:
      - name: Aeronautics
        min_credits: 18
        children:
          - name: Aerodynamics
            min_credits: 3
            courses: [AE 3120]
          - name: Air-Breathing Propulsion
            min_credits: 3
            courses: [AE 4210]
          - name: Composites
            min_credits: 3
            courses: [AE 3430]
          - name: Aircraft Dynamics and Control
            min_credits: 3
            courses: [AE 4310]
          - name: Aircraft Design
            min_credits: 3
            courses: [AE 4510]
          - name: Astronautics Elective
            min_credits: 3
            courses: [AE 2320, AE 3310, AE 4220, AE 4320]
      - name: Astronautics
        min_credits: 18
        children:
          - name: Rocket Propulsion
            min_credits: 3
            courses: [AE 4220]
          - name: Spacecraft Flight Dynamics and Control
            min_credits: 9
            courses: [AE 2320, AE 3310, AE 4320]
          - name: Spacecraft and Mission Design
            min_credits: 3
            courses: [AE 4520]
          - name: Aeronautics Elective
            min_credits: 3
            courses: [AE 3120, AE 3430, AE 4210, AE 4310]

  # not in the course listings
  - name: Major Qualifying Project
    min_credits: 9
