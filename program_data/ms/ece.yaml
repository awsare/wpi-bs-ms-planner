id: ece
bs_majors: [ece]
name: M.S. in Electrical and Computer Engineering
school: School of Engineering
catalog_url: https://wpi-grad.cleancatalog.net/electrical-and-computer-engineering/ms-in-electrical-and-computer-engineering
total_credits: 30
requirements:
  # 500-, 5000-, or 600-level ECE (thesis counts)
  - name: ECE Graduate Coursework
    min_credits: 21
    match:
      code_prefix: ECE
      academic_level: Graduate

  # thesis is optional: non-thesis is all coursework
  - name: Thesis Option
    max_credits: 9
    courses: [ECE 599]

  - name: Upper-Level Undergraduate
    max_credits: 6
    match:
      academic_level: Undergraduate
      code_min: 4000


  # the remaining credits: 500-level CS, DS, PH, engineering or MA; no min_credits, so the total decides
  - name: Other Graduate Coursework
    match:
      code_prefix: [CS, DS, PH, BME, CHE, CE, ECE, FP, MFE, MTE, ME, RBE, SYS, MA]
      academic_level: Graduate
