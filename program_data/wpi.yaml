# WPI-wide B.S. requirements, added to every bs/*.yaml
# https://wpi.cleancatalog.net/wpi-degree-requirements
requirements:
  # 6 courses: 3 depth + Inquiry Seminar, 1 breadth, and 1 humanities elective.
  # The depth/breadth/elective rules (topic, 2000-level, grouping, counts) are enforced by the check_hua_rules trigger.
  # not modeled: the seminar's topic matching the depth topic; finishing all 5 courses before the seminar
  - name: Humanities and Arts
    min_credits: 18
    children:
      # 3 thematically related courses in the student's depth topic, at least one at the 2000 level or above
      - name: Depth
        min_credits: 9
        match: &hua
          code_prefix: [AR, MU, TH, EN, WR, RH, HI, HU, INTL, PY, RE, SP, GN, ISE, AB, CN]
          academic_level: Undergraduate
          # the seminar has its own slot below
          exclude: [HU 3900, HU 3910]
      # 1 course outside the depth grouping: art/music/theatre, languages, literature/writing,
      # history/international studies, philosophy/religion (all-language depth may take breadth in a language)
      - name: Breadth
        min_credits: 3
        match: *hua
      # any 1 humanities and arts course
      - name: Humanities Elective
        min_credits: 3
        match: *hua
      - name: Inquiry Seminar or Practicum
        min_credits: 3
        courses: [HU 3900, HU 3910]

  # STEM social-implications courses don't count
  - name: Social Science
    min_credits: 6
    courses: [ID 2050]
    match:
      code_prefix: [ECON, ENV, DEV, GOV, PSY, SD, SOC, SS, STS]
      academic_level: Undergraduate
      exclude: [SS 3043]

  - name: Interactive Qualifying Project
    min_credits: 9
    courses: [IQP]

  # four 0.75-credit WPE classes
  - name: Wellness and Physical Education
    min_credits: 3
    match:
      code_prefix: WPE

  # whatever is left of the 135 after the distribution requirements (catalog sets no minimum);
  # no min_credits, so the B.S. total, not this bucket, decides how many are needed
  - name: Free Electives
    match:
      academic_level: Undergraduate
      exclude: [IQP, MQP]
